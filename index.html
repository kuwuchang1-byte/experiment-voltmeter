<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互感现象实验 — 数字电压表</title>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link href="https://fonts.loli.net/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f0f4f8;
            --bg-secondary: #e8eef4;
            --bg-card: #ffffff;
            --bg-elevated: #f8fafc;
            --border: #d0d8e4;
            --border-active: #b0c4de;
            --text-primary: #1a2a3a;
            --text-secondary: #4a6a8a;
            --text-muted: #8899aa;
            --accent: #2563eb;
            --accent-dim: #1d4ed8;
            --accent-glow: rgba(37, 99, 235, 0.08);
            --success: #059669;
            --success-glow: rgba(5, 150, 105, 0.1);
            --danger: #dc2626;
            --danger-glow: rgba(220, 38, 38, 0.1);
            --warning: #d97706;
            --canvas-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow-x: hidden;
        }

        /* Subtle grid texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .main-container {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 860px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 32px;
            align-items: start;
        }

        /* ── Header ── */
        .header {
            grid-column: 1 / -1;
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .title-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-glow);
            border: 1px solid var(--accent-dim);
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── Voltmeter Panel ── */
        .voltmeter-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .voltmeter-frame {
            background: var(--canvas-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            position: relative;
        }

        .voltmeter-frame::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 9px;
            background: linear-gradient(135deg, rgba(37, 99, 235,0.1), transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        #voltmeterCanvas {
            display: block;
        }

        .voltage-readout {
            text-align: center;
        }

        .voltage-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 56px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -2px;
            text-shadow: 0 0 30px var(--accent-glow);
        }

        .voltage-unit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 400;
            color: var(--accent-dim);
            margin-left: 4px;
        }

        /* ── Controls Panel ── */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 4px;
        }

        .panel-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .panel-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* Status */
        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.4s ease;
        }

        .status-indicator.connected {
            background: var(--success);
            box-shadow: 0 0 12px var(--success-glow), 0 0 4px var(--success);
        }

        .status-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-label.connected {
            color: var(--success);
        }

        /* Data counter */
        .data-counter {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .data-counter span {
            color: var(--text-secondary);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            letter-spacing: 0.5px;
            background: var(--bg-elevated);
            color: var(--text-secondary);
        }

        .btn:hover {
            border-color: var(--border-active);
            color: var(--text-primary);
            background: var(--bg-card);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: #d4b87a;
            border-color: #d4b87a;
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger-glow);
        }

        .btn-success {
            background: transparent;
            color: var(--success);
            border-color: var(--success);
        }

        .btn-success:hover {
            background: var(--success-glow);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn:disabled:hover {
            background: var(--bg-elevated);
            border-color: var(--border);
            color: var(--text-secondary);
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn-row .btn {
            flex: 1;
        }

        /* Hint */
        .hint {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.5;
            padding: 10px 12px;
            background: var(--bg-primary);
            border-radius: 6px;
            border-left: 2px solid var(--border);
        }

        .hint strong {
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ── Chart Section ── */
        .chart-section {
            grid-column: 1 / -1;
            display: none;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-top: 4px;
        }

        .chart-section.show {
            display: block;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .chart-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .chart-canvas-wrap {
            background: var(--canvas-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            height: 240px;
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .main-container {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 20px;
            }

            .header {
                flex-wrap: wrap;
            }

            .subtitle {
                margin-left: 0;
                width: 100%;
            }

            .voltage-value {
                font-size: 44px;
            }

            .voltmeter-frame canvas {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <span class="title">互感现象实验</span>
            <span class="title-badge">EXP.01</span>
            <span class="subtitle">Wireless Power Transfer</span>
        </div>

        <div class="voltmeter-panel">
            <div class="voltmeter-frame">
                <canvas id="voltmeterCanvas" width="260" height="260"></canvas>
            </div>
            <div class="voltage-readout">
                <span class="voltage-value" id="voltageValue">0.00</span>
                <span class="voltage-unit">V</span>
            </div>
        </div>

        <div class="controls-panel">
            <div class="panel-section">
                <div class="panel-label">Connection</div>
                <div class="status-row">
                    <div class="status-indicator" id="statusDot"></div>
                    <span class="status-label" id="statusText">NOT CONNECTED</span>
                </div>
                <div class="data-counter">Recorded: <span id="dataCount">0</span> points</div>
            </div>

            <div class="panel-section">
                <div class="panel-label">Controls</div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="connectBtn" onclick="toggleConnect()">
                        CONNECT DEVICE
                    </button>
                    <div class="btn-row">
                        <button class="btn btn-success" id="chartBtn" onclick="showChart()" disabled>
                            CHART
                        </button>
                        <button class="btn" id="downloadBtn" onclick="downloadChart()" disabled>
                            EXPORT .XLSX
                        </button>
                    </div>
                </div>
            </div>

            <div class="hint">
                <strong>Requirements:</strong> Chrome 89+ / Edge 89+, Bluetooth enabled on device.
            </div>
        </div>

        <div class="chart-section" id="chartSection">
            <div class="chart-header">
                <div class="chart-title">Voltage vs Time</div>
            </div>
            <div class="chart-canvas-wrap">
                <canvas id="chartCanvas"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script>
        const SERVICE_UUID = '0000fff0-0000-1000-8000-00805f9b34fb';
        const CHARACTERISTIC_UUID = '0000fff1-0000-1000-8000-00805f9b34fb';

        let canvas, ctx;
        let canvasWidth, canvasHeight;
        let bgCanvas, bgCtx; // 离屏背景缓存
        let connected = false;
        let device = null;
        let characteristic = null;
        let currentVoltage = 0;
        let targetVoltage = 0;
        let animationId = null;
        let voltageData = [];
        let timeData = [];
        let startTime = null;
        let chart = null;
        // 指针动画参数
        const NEEDLE_START = Math.PI * 0.75;
        const NEEDLE_END = Math.PI * 2.25;
        const NEEDLE_TOTAL = NEEDLE_END - NEEDLE_START;
        const MAX_VOLTAGE = 4.0;

        window.onload = function() {
            initCanvas();
            startAnimation();
        };

        function initCanvas() {
            canvas = document.getElementById('voltmeterCanvas');
            ctx = canvas.getContext('2d');
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;
            // 构建离屏背景（只画一次）
            buildBackground();
            // 首帧绘制
            drawNeedle(0);
        }

        // === 离屏绘制静态背景（只执行一次） ===
        function buildBackground() {
            bgCanvas = document.createElement('canvas');
            bgCanvas.width = canvasWidth;
            bgCanvas.height = canvasHeight;
            bgCtx = bgCanvas.getContext('2d');

            const cx = canvasWidth / 2;
            const cy = canvasHeight / 2;
            const radius = Math.min(cx, cy) - 12;

            // Outer ring
            bgCtx.beginPath();
            bgCtx.arc(cx, cy, radius, 0, Math.PI * 2);
            const ringGrad = bgCtx.createLinearGradient(0, 0, canvasWidth, canvasHeight);
            ringGrad.addColorStop(0, '#2a2a2f');
            ringGrad.addColorStop(0.5, '#3a3a40');
            ringGrad.addColorStop(1, '#2a2a2f');
            bgCtx.fillStyle = ringGrad;
            bgCtx.fill();
            bgCtx.strokeStyle = '#444';
            bgCtx.lineWidth = 1;
            bgCtx.stroke();

            // Inner face
            bgCtx.beginPath();
            bgCtx.arc(cx, cy, radius - 6, 0, Math.PI * 2);
            const faceGrad = bgCtx.createRadialGradient(cx - 10, cy - 10, 0, cx, cy, radius - 6);
            faceGrad.addColorStop(0, '#2a2a2e');
            faceGrad.addColorStop(1, '#1a1a1e');
            bgCtx.fillStyle = faceGrad;
            bgCtx.fill();

            // Tick marks
            for (let i = 0; i <= 40; i++) {
                const angle = NEEDLE_START + (NEEDLE_TOTAL * i / 40);
                const isMajor = i % 4 === 0;
                const outerR = radius - 8;
                const innerR = isMajor ? radius - 24 : radius - 16;

                bgCtx.beginPath();
                bgCtx.moveTo(cx + innerR * Math.cos(angle), cy + innerR * Math.sin(angle));
                bgCtx.lineTo(cx + outerR * Math.cos(angle), cy + outerR * Math.sin(angle));
                bgCtx.strokeStyle = isMajor ? '#999' : '#555';
                bgCtx.lineWidth = isMajor ? 1.5 : 0.8;
                bgCtx.stroke();

                if (isMajor) {
                    const labelR = radius - 34;
                    const val = (i / 40 * MAX_VOLTAGE).toFixed(1);
                    bgCtx.save();
                    bgCtx.font = '600 11px "JetBrains Mono", monospace';
                    bgCtx.fillStyle = '#bbb';
                    bgCtx.textAlign = 'center';
                    bgCtx.textBaseline = 'middle';
                    bgCtx.fillText(val, cx + labelR * Math.cos(angle), cy + labelR * Math.sin(angle));
                    bgCtx.restore();
                }
            }

            // Unit label
            bgCtx.save();
            bgCtx.font = '500 10px "JetBrains Mono", monospace';
            bgCtx.fillStyle = '#888';
            bgCtx.textAlign = 'center';
            bgCtx.fillText('VOLTAGE', cx, cy + 20);
            bgCtx.restore();
        }

        // === 只画指针（每帧调用，极轻量） ===
        function drawNeedle(voltage) {
            const cx = canvasWidth / 2;
            const cy = canvasHeight / 2;
            const radius = Math.min(cx, cy) - 12;
            const needleLen = radius - 42;
            const tailLen = 12;

            // 贴背景
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.drawImage(bgCanvas, 0, 0);

            const needleAngle = NEEDLE_START + (NEEDLE_TOTAL * Math.min(voltage, MAX_VOLTAGE) / MAX_VOLTAGE);

            // Needle shadow
            ctx.save();
            ctx.translate(1.5, 1.5);
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.moveTo(cx - tailLen * Math.cos(needleAngle), cy - tailLen * Math.sin(needleAngle));
            ctx.lineTo(cx + needleLen * Math.cos(needleAngle), cy + needleLen * Math.sin(needleAngle));
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();

            // Needle
            const needleGrad = ctx.createLinearGradient(
                cx - tailLen * Math.cos(needleAngle),
                cy - tailLen * Math.sin(needleAngle),
                cx + needleLen * Math.cos(needleAngle),
                cy + needleLen * Math.sin(needleAngle)
            );
            needleGrad.addColorStop(0, '#1e40af');
            needleGrad.addColorStop(0.3, '#cc4444');
            needleGrad.addColorStop(1, '#ff5555');

            ctx.beginPath();
            ctx.moveTo(cx - tailLen * Math.cos(needleAngle), cy - tailLen * Math.sin(needleAngle));
            ctx.lineTo(cx + needleLen * Math.cos(needleAngle), cy + needleLen * Math.sin(needleAngle));
            ctx.strokeStyle = needleGrad;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Center hub
            const hubGrad = ctx.createRadialGradient(cx - 1, cy - 1, 0, cx, cy, 8);
            hubGrad.addColorStop(0, '#555');
            hubGrad.addColorStop(0.6, '#64748b');
            hubGrad.addColorStop(1, '#222');
            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, Math.PI * 2);
            ctx.fillStyle = hubGrad;
            ctx.fill();
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 0.5;
            ctx.stroke();
        }

        function startAnimation() {
            function animate() {
                currentVoltage += (targetVoltage - currentVoltage) * 0.25;
                drawNeedle(currentVoltage);
                document.getElementById('voltageValue').textContent = currentVoltage.toFixed(2);
                animationId = requestAnimationFrame(animate);
            }
            animate();
        }

        function toggleConnect() {
            if (connected) {
                disconnect();
            } else {
                connect();
            }
        }

        async function connect() {
            try {
                updateStatus('SEARCHING...', false);

                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32-Voltmeter' }],
                    optionalServices: [SERVICE_UUID]
                });

                updateStatus('CONNECTING...', false);

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);

                voltageData = [];
                timeData = [];
                startTime = Date.now();
                updateDataCount();

                connected = true;
                updateStatus('CONNECTED', true);
                updateButton(true);

            } catch (error) {
                console.error('Connection failed:', error);
                updateStatus('CONNECTION FAILED', false);
            }
        }

        function disconnect() {
            if (device && device.gatt.connected) {
                device.gatt.disconnect();
            }

            connected = false;
            targetVoltage = 0;
            updateStatus('DISCONNECTED', false);
            updateButton(false);

            if (voltageData.length > 0) {
                document.getElementById('chartBtn').disabled = false;
                document.getElementById('downloadBtn').disabled = false;
            }
        }

        function handleData(event) {
            const value = event.target.value;
            const voltage = value.getFloat32(0, true);

            targetVoltage = voltage;

            const currentTime = (Date.now() - startTime) / 1000;
            voltageData.push(voltage);
            timeData.push(currentTime);
            updateDataCount();
        }

        function updateStatus(text, isConnected) {
            document.getElementById('statusText').textContent = text;
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusText');
            if (isConnected) {
                dot.classList.add('connected');
                label.classList.add('connected');
            } else {
                dot.classList.remove('connected');
                label.classList.remove('connected');
            }
        }

        function updateButton(isConnected) {
            const btn = document.getElementById('connectBtn');
            if (isConnected) {
                btn.textContent = 'DISCONNECT';
                btn.className = 'btn btn-danger';
            } else {
                btn.textContent = 'CONNECT DEVICE';
                btn.className = 'btn btn-primary';
            }
        }

        function updateDataCount() {
            document.getElementById('dataCount').textContent = voltageData.length;
        }

        function showChart() {
            if (voltageData.length === 0) {
                alert('No data recorded yet');
                return;
            }

            const section = document.getElementById('chartSection');
            section.classList.add('show');

            if (chart) {
                chart.destroy();
            }

            const ctx = document.getElementById('chartCanvas').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: timeData.map(t => t.toFixed(1) + 's'),
                    datasets: [{
                        label: 'Voltage (V)',
                        data: voltageData,
                        borderColor: '#c8a96e',
                        backgroundColor: 'rgba(200, 169, 110, 0.08)',
                        borderWidth: 1.5,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0,
                        pointHoverRadius: 3,
                        pointHoverBackgroundColor: '#c8a96e'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1a1a1f',
                            borderColor: '#333',
                            borderWidth: 1,
                            titleFont: { family: 'JetBrains Mono', size: 11 },
                            bodyFont: { family: 'JetBrains Mono', size: 11 },
                            padding: 10,
                            callbacks: {
                                label: ctx => ctx.parsed.y.toFixed(3) + ' V'
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(0,0,0,0.06)' },
                            ticks: {
                                color: '#555',
                                font: { family: 'JetBrains Mono', size: 10 },
                                maxTicksLimit: 8
                            },
                            title: {
                                display: true,
                                text: 'TIME',
                                color: '#555',
                                font: { family: 'JetBrains Mono', size: 10, weight: 600 }
                            }
                        },
                        y: {
                            grid: { color: 'rgba(0,0,0,0.06)' },
                            ticks: {
                                color: '#555',
                                font: { family: 'JetBrains Mono', size: 10 }
                            },
                            beginAtZero: true,
                            max: 4.0,
                            title: {
                                display: true,
                                text: 'VOLTAGE (V)',
                                color: '#555',
                                font: { family: 'JetBrains Mono', size: 10, weight: 600 }
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        function downloadChart() {
            if (voltageData.length === 0) {
                alert('No data recorded yet');
                return;
            }

            const wb = XLSX.utils.book_new();
            const data = [['No.', 'Time (s)', 'Voltage (V)']];

            for (let i = 0; i < voltageData.length; i++) {
                data.push([
                    i + 1,
                    parseFloat(timeData[i].toFixed(2)),
                    parseFloat(voltageData[i].toFixed(4))
                ]);
            }

            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{ wch: 8 }, { wch: 14 }, { wch: 14 }];
            XLSX.utils.book_append_sheet(wb, ws, 'Data');
            XLSX.writeFile(wb, 'experiment_data.xlsx');
        }
    </script>
</body>
</html>
